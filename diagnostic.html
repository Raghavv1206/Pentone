<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chrome Prompt API Isolated Diagnostic Test</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; padding: 24px; max-width: 720px; margin: 0 auto; background: #0f172a; color: #f8fafc; }
    h1 { font-size: 20px; color: #38bdf8; margin-bottom: 8px; }
    p { font-size: 14px; color: #94a3b8; line-height: 1.5; }
    button { background: #0284c7; color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; margin-top: 12px; }
    button:hover { background: #0369a1; }
    button:disabled { background: #334155; cursor: not-allowed; }
    #log { background: #020617; border: 1px solid #1e293b; border-radius: 8px; padding: 16px; margin-top: 16px; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; min-height: 200px; white-space: pre-wrap; line-height: 1.6; }
    .success { color: #4ade80; }
    .error { color: #f87171; }
    .info { color: #93c5fd; }
    .warn { color: #fbbf24; }
  </style>
</head>
<body>
  <h1>Chrome Built-in AI (Prompt API) Isolated Diagnostic</h1>
  <p>This test isolates Chrome's on-device model execution process independently of Pentone's tool loop, system prompt, and extension dependencies.</p>
  
  <button id="runBtn" onclick="runDiagnostic()">Run Isolated Diagnostic Test</button>
  <div id="log">Click "Run Isolated Diagnostic Test" to begin...</div>

  <script>
    const logEl = document.getElementById('log');
    const runBtn = document.getElementById('runBtn');

    function log(msg, type = 'info') {
      const span = document.createElement('span');
      span.className = type;
      span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n`;
      logEl.appendChild(span);
      console.log(`[Diagnostic] ${msg}`);
    }

    async function runDiagnostic() {
      runBtn.disabled = true;
      logEl.textContent = '';
      log('Starting isolated Prompt API diagnostic...', 'info');

      try {
        // Step 1: Check window.LanguageModel presence
        if (typeof window === 'undefined' || !('LanguageModel' in window)) {
          throw new Error('window.LanguageModel is undefined. Ensure chrome://flags/#prompt-api-for-gemini-nano is enabled.');
        }
        log('✔ window.LanguageModel API is present in browser scope', 'success');

        // Step 2: Check Availability with correct English output language
        const targetConfig = {
          expectedInputs: [{ type: 'text', languages: ['en'] }],
          expectedOutputs: [{ type: 'text', languages: ['en'] }]
        };

        log('Checking availability with language config: { expectedOutputs: [{ type: "text", languages: ["en"] }] }...', 'info');
        const availability = await window.LanguageModel.availability(targetConfig);
        log(`✔ Model availability result: "${availability}"`, availability === 'readily' || availability === 'available' ? 'success' : 'warn');

        if (availability === 'no' || availability === 'unavailable') {
          throw new Error(`Model reports availability="${availability}". If the model previously crashed, Chrome disables it until browser restart.`);
        }

        // Step 3: Create isolated session (NO image modality, NO 5,800 token system prompt)
        log('Creating isolated session with pure text & English output configuration...', 'info');
        const session = await window.LanguageModel.create({
          expectedInputs: [{ type: 'text', languages: ['en'] }],
          expectedOutputs: [{ type: 'text', languages: ['en'] }]
        });
        log(`✔ Session created successfully! Context window: ${session.contextWindow || 'unknown'} tokens`, 'success');

        // Step 4: Run single short inference test
        const testPrompt = 'Respond with exactly: "Hello, Pentone diagnostic passed successfully!"';
        log(`Sending test prompt: "${testPrompt}"...`, 'info');

        const startTime = performance.now();
        const response = await session.prompt(testPrompt);
        const duration = Math.round(performance.now() - startTime);

        log(`✔ Inference received in ${duration}ms!`, 'success');
        log(`Model response: "${response.trim()}"`, 'success');
        log(`Token accounting: inputUsage=${session.inputUsage || 0}, inputQuota=${session.inputQuota || session.contextWindow}`, 'info');

        // Step 5: Safe cleanup
        session.destroy();
        log('✔ Session safely destroyed without resource leaks', 'success');
        log('=== DIAGNOSTIC PASSED: Model runtime is healthy and responsive ===', 'success');

      } catch (err) {
        log(`❌ Diagnostic failed: ${err.message}`, 'error');
        if (err.message.includes('crashed too many times')) {
          log('🚨 ROOT CAUSE CONFIRMED: Chrome circuit breaker is active.', 'error');
          log('To reset: Close ALL Chrome windows completely (or navigate to chrome://restart), then rerun.', 'warn');
        }
      } finally {
        runBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
